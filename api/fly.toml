# Fly.io config for the API. Deploy from the REPO ROOT (the Dockerfile copies
# api/ + data/decision.duckdb, so the build context must be the root):
#   fly apps create uk-housing-decision-support-api    # one-time, claim the name
#   fly deploy --config api/fly.toml                   # build + ship
# Keeps one machine running. Measured 2026-07-31: a cold start took 19.7s to
# first byte, and an uncached area page 22.2s end to end, because the website
# renders server-side against this API. The site's traffic arrives by a link
# rather than in a steady stream, so almost every visit was landing on a cold
# machine. One always-on shared-cpu-1x is the cost of that not happening.
app = "uk-housing-decision-support-api"
primary_region = "lhr"

[build]
  # Path is relative to THIS config file (api/), while the build context is the
  # working dir you run `fly deploy` from (the repo root) — so the Dockerfile's
  # `COPY api/ ... data/decision.duckdb` resolve against the root.
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # The floor auto_stop respects: extra machines may stop, this one never does.
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
