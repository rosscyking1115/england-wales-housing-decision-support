# Fly.io config for the API. Deploy from the REPO ROOT (the Dockerfile copies
# api/ + data/decision.duckdb, so the build context must be the root):
#   fly apps create uk-housing-decision-support-api    # one-time, claim the name
#   fly deploy --config api/fly.toml                   # build + ship
# Scales to zero when idle. Measured 2026-07-31, so the cost is known rather
# than assumed: a cold start takes 19.7s to first byte (0.05s warm), and an
# uncached area page 22.2s end to end, because the website renders server-side
# against this API on its dynamic routes. The static routes - homepage,
# sitemap, robots, methodology, rankings - are prerendered on Vercel and are
# not affected. min_machines_running = 1 would remove the cold start for
# $3.32/month at the size configured below; declined 2026-08-01, this being a
# reference project rather than a flagship and not worth a recurring charge.
app = "uk-housing-decision-support-api"
primary_region = "lhr"

[build]
  # Path is relative to THIS config file (api/), while the build context is the
  # working dir you run `fly deploy` from (the repo root) — so the Dockerfile's
  # `COPY api/ ... data/decision.duckdb` resolve against the root.
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
